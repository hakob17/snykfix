name: snykfix

on:
  schedule:
    - cron: "17 6 * * 1-5"   # weekdays 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only (no PRs, no ticket changes)"
        type: boolean
        default: true
      only:
        description: "Limit actions to one campaign key, e.g. lib:@acme/http-client"
        type: string
        required: false

concurrency: snykfix

jobs:
  snykfix:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # Toolchains so Snyk can resolve every ecosystem and the agent can build/test.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }

      - name: Install tools
        run: |
          npm install -g snyk @anthropic-ai/claude-code
          pip install .

      - name: Run
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}                    # Work Items: Read & Write
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_CFG_ORG: ${{ vars.SNYK_CFG_ORG }}             # Snyk org slug (Actions variable)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.SNYKFIX_GH_TOKEN }}          # GitHub App/PAT with contents+PR write on target repos
          CMD: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'plan' || 'run' }}
          ONLY: ${{ inputs.only }}
        run: |
          gh auth setup-git
          snykfix "$CMD" --config config.yaml ${ONLY:+--only "$ONLY"}

      - if: always()
        run: cat snykfix-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snykfix-report
          path: snykfix-report.*
